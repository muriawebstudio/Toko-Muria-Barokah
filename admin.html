<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Toko Muria Barokah</title>
    <meta name="theme-color" content="#3c2f2f">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400..700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3c2f2f;
            --accent: #c25e1a;
            --bg: #f8f5f2;
            --card: #ffffff;
            --text: #3c2f2f;
            --text-muted: #7c6e6e;
            --danger: #d93838;
            --success: #25D366;
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Quicksand', sans-serif; font-weight: 500; }
        html, body { background-color: var(--bg); color: var(--text); overflow-x: hidden; width: 100%; }
        
        /* Pengunci latar belakang utama yang aman */
        body.modal-open { 
            overflow: hidden !important;
        }
        
        header { background: var(--primary); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        header h1 { font-size: 1.2rem; font-weight: 700; }
        
        .nav-tabs { display: flex; background: white; overflow-x: auto; border-bottom: 1px solid rgba(0,0,0,0.08); position: sticky; top: 54px; z-index: 90; }
        .tab-btn { flex: 1; min-width: 100px; text-align: center; padding: 14px; background: none; border: none; font-size: 0.9rem; font-weight: 700; color: var(--text-muted); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; transition: 0.2s; }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); background: rgba(194, 94, 26, 0.03); }
        
        .container { width: min(800px, 92%); margin: 20px auto 100px auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .section-header h2 { font-size: 1.2rem; font-weight: 700; }
        
        .btn { padding: 10px 16px; border: none; border-radius: 999px; font-size: 0.85rem; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: 0.2s; text-decoration: none; }
        .btn-accent { background: var(--accent); color: white; }
        .btn-accent:hover { background: #a14a10; }
        .btn-danger { background: rgba(217, 56, 56, 0.1); color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: white; }
        .btn-secondary { background: #e2deda; color: var(--text); }
        
        .card-list { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
        .item-card { background: var(--card); padding: 15px; border-radius: 16px; border: 1px solid rgba(0,0,0,0.04); box-shadow: 0 4px 10px rgba(0,0,0,0.02); display: flex; justify-content: space-between; align-items: center; }
        .item-info h4 { font-weight: 700; font-size: 1rem; margin-bottom: 4px; }
        .item-info p { font-size: 0.85rem; color: var(--text-muted); }
        
        /* BACKDROP MODAL STATIS */
        .modal { 
            position: fixed; 
            inset: 0; 
            background: rgba(60, 47, 47, 0.5); 
            backdrop-filter: blur(8px); 
            display: flex; 
            justify-content: center; 
            align-items: flex-end; 
            z-index: 1000;
            overflow: hidden; 
        }
        @media (min-width: 481px) { 
            .modal { align-items: center; padding: 20px; } 
        }
        .hidden { display: none !important; }
        
        /* KOTAK KONTEN UTAMA MODAL */
        .modal-content { 
            background: white; 
            width: 100%; 
            max-height: 85vh; 
            border-top-left-radius: 24px; 
            border-top-right-radius: 24px; 
            display: flex; 
            flex-direction: column; 
            position: relative;
            animation: slideUp 0.25s ease-out; 
        }
        @media (min-width: 481px) { 
            .modal-content { max-width: 500px; border-radius: 24px; max-height: 80vh; } 
        }
        
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        /* HEADER MODAL TETAP DI ATAS */
        .modal-header { 
            padding: 20px; 
            border-bottom: 1px solid rgba(0,0,0,0.06); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: white; 
            flex-shrink: 0; 
        }
        .modal-header h3 { font-weight: 700; font-size: 1.1rem; text-transform: none; } /* Mencegah pemaksaan kapitalisasi lewat CSS global */
        .close-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-muted); width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; }
        
        /* AREA FORMULIR YANG BISA DI-SCROLL MANDIRI */
        .modal-body { 
            padding: 20px; 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; 
            display: flex; 
            flex-direction: column; 
            gap: 14px; 
            flex-grow: 1; 
            background: white;
        }
        
        /* GARIS PENANDA SCROLL DI KANAN FORM */
        .modal-body::-webkit-scrollbar { width: 6px; }
        .modal-body::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.02); border-radius: 10px; }
        .modal-body::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
        
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 0.85rem; font-weight: 700; color: var(--text); }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px 16px; border: 1px solid #e2deda; border-radius: 12px; font-size: 0.9rem; outline: none; background: #faf8f6; font-weight: 600; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--accent); background: white; }
        
        /* FOOTER MODAL TETAP DI BAWAH */
        .modal-footer { 
            padding: 15px 20px; 
            border-top: 1px solid rgba(0,0,0,0.06); 
            display: flex; 
            gap: 10px; 
            background: white; 
            flex-shrink: 0; 
        }
        .modal-footer .btn { flex: 1; justify-content: center; padding: 12px; }
        
        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--primary); color: white; padding: 12px 24px; border-radius: 12px; font-size: 0.9rem; font-weight: 700; opacity: 0; transition: 0.3s; z-index: 2000; box-shadow: 0 10px 25px rgba(0,0,0,0.2); pointer-events: none; text-align: center; width: max-content; max-width: 90%; }
        .loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.7); display: flex; justify-content: center; align-items: center; z-index: 9999; font-weight: 700; color: var(--accent); }
    </style>
</head>
<body>

    <header>
        <h1>Dashboard Admin Muria Barokah</h1>
        <a href="../index.html" style="color: white; font-size: 0.85rem; font-weight: 700; text-decoration: none;">Lihat Toko →</a>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('tab-produk')">📦 Produk</button>
        <button class="tab-btn" onclick="switchTab('tab-galeri')">🖼️ Galeri</button>
        <button class="tab-btn" onclick="switchTab('tab-testimoni')">💬 Testimoni</button>
        <button class="tab-btn" onclick="switchTab('tab-faq')">❓ FAQ</button>
    </div>

    <main class="container">
        <div id="tab-produk" class="tab-content active">
            <div class="section-header">
                <h2>Kelola Daftar Produk</h2>
                <button class="btn btn-accent" onclick="openForm('produk')">➕ Produk Baru</button>
            </div>
            <div class="card-list" id="list-produk">Mohon tunggu...</div>
        </div>

        <div id="tab-galeri" class="tab-content">
            <div class="section-header">
                <h2>Kelola Foto Galeri</h2>
                <button class="btn btn-accent" onclick="openForm('galeri')">➕ Foto Baru</button>
            </div>
            <div class="card-list" id="list-galeri">Mohon tunggu...</div>
        </div>

        <div id="tab-testimoni" class="tab-content">
            <div class="section-header">
                <h2>Kelola Testimoni</h2>
                <button class="btn btn-accent" onclick="openForm('testimoni')">➕ Testimoni Baru</button>
            </div>
            <div class="card-list" id="list-testimoni">Mohon tunggu...</div>
        </div>

        <div id="tab-faq" class="tab-content">
            <div class="section-header">
                <h2>Kelola Pertanyaan (FAQ)</h2>
                <button class="btn btn-accent" onclick="openForm('faq')">➕ FAQ Baru</button>
            </div>
            <div class="card-list" id="list-faq">Mohon tunggu...</div>
        </div>
    </main>

    <div id="form-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Tambah Data</h3>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            <form id="main-form" onsubmit="handleFormSubmit(event)" style="display: flex; flex-direction: column; overflow: hidden; height: 100%;">
                <div class="modal-body" id="modal-fields">
                    </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Batal</button>
                    <button type="submit" class="btn btn-accent">Simpan Data</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast"></div>
    <div id="loading" class="loading-overlay hidden">Memproses data ke Google Sheets...</div>

    <script>
        // === KONFIGURASI UTAMA ===
        const API_URL = "PASANG_URL_APPS_SCRIPT_DI_SINI"; 
        const SPREADSHEET_ID = "15ZPzJDFRCxmnEzd-XlYdzBEa-DUY4fQT-Fni3ETOzZc";
        
        let currentTabType = "produk";

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 2500);
        }
        function toggleLoading(show) {
            document.getElementById('loading').classList[show ? 'remove' : 'add']('hidden');
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
            currentTabType = tabId.replace('tab-', '');
            fetchData();
        }

        async function fetchData() {
            let sheetName = currentTabType === 'produk' ? 'Daftar Produk' : 
                            currentTabType === 'galeri' ? 'Galeri' :
                            currentTabType === 'testimoni' ? 'Testimoni' : 'FAQ';
            
            const container = document.getElementById(`list-${currentTabType}`);
            container.innerHTML = "Memuat data terbaru...";
            
            try {
                const res = await fetch(`https://opensheet.elk.sh/${SPREADSHEET_ID}/${sheetName}`);
                const data = await res.json();
                renderList(data);
            } catch (err) {
                container.innerHTML = "<p style='color:red;'>Gagal memuat data dari Spreadsheet.</p>";
            }
        }

        function renderList(data) {
            const container = document.getElementById(`list-${currentTabType}`);
            container.innerHTML = "";
            
            if (!data.length || data.error) {
                container.innerHTML = "<p style='color:var(--text-muted); text-align:center; padding: 20px;'>Belum ada data di lembar ini.</p>";
                return;
            }

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';
                
                let title = "", sub = "";
                let uniqueId = item.id || item.ID || "";
                
                if (currentTabType === 'produk') {
                    title = item.nama || "Tanpa Nama";
                    sub = `Harga: Rp ${item.harga_pelanggan || 0} | Status: ${item.status || 'Nonaktif'}`;
                } else if (currentTabType === 'galeri') {
                    title = item.judul || "Tanpa Judul";
                    sub = item.gambar ? "Ada Gambar" : "Tidak ada link gambar";
                } else if (currentTabType === 'testimoni') {
                    title = item.nama || "Anonim";
                    sub = `Bintang ${item.bintang || 5}: "${item.komentar || ''}"`;
                } else if (currentTabType === 'faq') {
                    title = item.pertanyaan || "Pertanyaan kosong";
                    sub = item.jawaban || "Jawaban kosong";
                }

                card.innerHTML = `
                    <div class="item-info">
                        <h4>${title}</h4>
                        <p>${sub}</p>
                    </div>
                    <div style="display:flex; gap:8px;">
                        <button class="btn btn-danger" onclick="deleteItem('${uniqueId}')">Hapus</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openForm(type) {
            // Mengubah teks (misal: "produk" -> "Tambah Produk", "faq" -> "Tambah Faq") dengan format Capital Case
            let formattedType = type.charAt(0).toUpperCase() + type.slice(1).toLowerCase();
            document.getElementById('modal-title').textContent = `Tambah ${formattedType}`;
            
            const fieldsContainer = document.getElementById('modal-fields');
            fieldsContainer.innerHTML = "";
            
            if (type === 'produk') {
                fieldsContainer.innerHTML = `
                    <div class="form-group"><label>Nama Produk</label><input type="text" id="inp-nama" required></div>
                    <div class="form-group"><label>Harga Kasir (Beli)</label><input type="number" id="inp-harga_kasir" value="0"></div>
                    <div class="form-group"><label>Harga Pelanggan (Jual)</label><input type="number" id="inp-harga_pelanggan" required></div>
                    <div class="form-group"><label>Link Gambar (Gunakan tanda | jika lebih dari 1 gambar)</label><input type="text" id="inp-gambar" placeholder="https://..."></div>
                    <div class="form-group"><label>Kategori</label><input type="text" id="inp-kategori" placeholder="Makanan, Mainan, dll" required></div>
                    <div class="form-group"><label>Deskripsi Pendek</label><textarea id="inp-deskripsi" rows="2"></textarea></div>
                    <div class="form-group"><label>Deskripsi Pelanggan (Detail)</label><textarea id="inp-desk_pelanggan" rows="3"></textarea></div>
                    <div class="form-group"><label>Opsi Produk (Gunakan tanda | pemisah)</label><input type="text" id="inp-opsi_produk" placeholder="Pedas|Sedang|Manis"></div>
                    <div class="form-group"><label>Mode Pilihan</label><select id="inp-mode_pilihan"><option value="single">Single (Pilih salah satu)</option><option value="multiple">Multiple (Bisa pilih banyak)</option></select></div>
                    <div class="form-group"><label>Status</label><select id="inp-status"><option value="aktif">Aktif</option><option value="nonaktif">Nonaktif</option></select></div>
                `;
            } else if (type === 'galeri') {
                fieldsContainer.innerHTML = `
                    <div class="form-group"><label>Judul Foto</label><input type="text" id="inp-judul" required></div>
                    <div class="form-group"><label>URL Link Gambar</label><input type="text" id="inp-gambar" required></div>
                    <div class="form-group"><label>Status Aktif</label><select id="inp-aktif"><option value="YA">YA</option><option value="TIDAK">TIDAK</option></select></div>
                `;
            } else if (type === 'testimoni') {
                fieldsContainer.innerHTML = `
                    <div class="form-group"><label>Nama Pelanggan</label><input type="text" id="inp-nama" required></div>
                    <div class="form-group"><label>Jumlah Bintang (1-5)</label><input type="number" id="inp-bintang" min="1" max="5" value="5" required></div>
                    <div class="form-group"><label>Isi Komentar Testimoni</label><textarea id="inp-komentar" rows="3" required></textarea></div>
                    <div class="form-group"><label>Status Aktif</label><select id="inp-aktif"><option value="YA">YA</option><option value="TIDAK">TIDAK</option></select></div>
                `;
            } else if (type === 'faq') {
                // Khusus FAQ diubah menjadi semua huruf kapital karena merupakan sebuah singkatan
                document.getElementById('modal-title').textContent = "Tambah FAQ";
                fieldsContainer.innerHTML = `
                    <div class="form-group"><label>Pertanyaan</label><input type="text" id="inp-pertanyaan" required></div>
                    <div class="form-group"><label>Jawaban</label><textarea id="inp-jawaban" rows="4" required></textarea></div>
                    <div class="form-group"><label>Status Aktif</label><select id="inp-aktif"><option value="YA">YA</option><option value="TIDAK">TIDAK</option></select></div>
                `;
            }
            
            document.body.classList.add('modal-open');
            document.getElementById('form-modal').classList.remove('hidden');
            
            // Setel scroll area isian kembali ke posisi paling atas
            document.getElementById('modal-fields').scrollTop = 0;
        }

        function closeModal() {
            document.body.classList.remove('modal-open');
            document.getElementById('form-modal').classList.add('hidden');
        }

        // Klik di luar kotak modal-content untuk menutup otomatis
        document.getElementById('form-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        async function handleFormSubmit(e) {
            e.preventDefault();
            if(API_URL === "PASANG_URL_APPS_SCRIPT_DI_SINI") {
                alert("Harap pasang URL Google Apps Script Anda terlebih dahulu di variabel API_URL.");
                return;
            }
            
            toggleLoading(true);
            closeModal();

            let sheetName = currentTabType === 'produk' ? 'Daftar Produk' : 
                            currentTabType === 'galeri' ? 'Galeri' :
                            currentTabType === 'testimoni' ? 'Testimoni' : 'FAQ';

            let payloadData = {};
            const inputs = document.querySelectorAll("[id^='inp-']");
            inputs.forEach(input => {
                const key = input.id.replace('inp-', '');
                payloadData[key] = input.value;
            });

            const bodyPayload = {
                action: "add",
                sheet: sheetName,
                data: payloadData
            };

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    mode: "cors",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify(bodyPayload)
                });
                const result = await response.json();
                if(result.status === "success") {
                    showToast("🎉 Data Berhasil Disimpan!");
                    fetchData();
                } else {
                    alert("Gagal: " + result.message);
                }
            } catch (err) {
                showToast("Data diproses, menyegarkan antarmuka...");
                setTimeout(fetchData, 2000);
            } finally {
                toggleLoading(false);
            }
        }

        async function deleteItem(id) {
            if (!id) { alert("ID item kosong, tidak dapat dihapus lewat aplikasi."); return; }
            if (!confirm("Apakah Anda yakin ingin menghapus data ini secara permanen dari Spreadsheet?")) return;
            
            toggleLoading(true);
            let sheetName = currentTabType === 'produk' ? 'Daftar Produk' : 
                            currentTabType === 'galeri' ? 'Galeri' :
                            currentTabType === 'testimoni' ? 'Testimoni' : 'FAQ';

            const bodyPayload = {
                action: "delete",
                sheet: sheetName,
                id: id
            };

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify(bodyPayload)
                });
                const result = await response.json();
                if(result.status === "success") {
                    showToast("❌ Data Berhasil Dihapus!");
                    fetchData();
                } else {
                    alert("Gagal menghapus: " + result.message);
                }
            } catch (err) {
                showToast("Data diperbarui, menyegarkan antarmuka...");
                setTimeout(fetchData, 2000);
            } finally {
                toggleLoading(false);
            }
        }

        document.addEventListener("DOMContentLoaded", fetchData);
    </script>
</body>
</html>
